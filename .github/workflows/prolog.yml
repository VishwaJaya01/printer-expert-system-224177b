name: Prolog checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Run tests
        run: swipl -q -s tests/test_engine.pl
      - name: Run demonstrations
        run: swipl -q -s src/main.pl -- --demo
